"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$python\
$c\
cpp\
$fortran\
$fill\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[fill]
symbol = ' '

[directory]
format = "[$path]($style) "
style = "bold #81a1c1"
truncation_length = 5
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "#cfd8dc"
format = "[$symbol$branch]($style)"

[git_status]
format = "[[($conflicted$untracked$modified$staged$renamed$deleted)](218)($ahead_behind$stashed)]($style)"
# format = "[$all_status$ahead_behind]($style) "
# style = "bold #cfd8dc"
style = "cyan"
modified = "*"
untracked = "?"
staged = "+"
conflicted = "="
ahead = "⇡"
behind = "⇣"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](blue)"

[cmd_duration]
format = "[$duration]($style)"
style = "yellow"

[python]
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\))]($style)'
style = "bright-black"

[c]
symbol = " "
format = '[${symbol}${version}]($style)'
style = "bright-black"

[cpp]
symbol = " "
format = '[${symbol}${version}]($style)'
style = "bright-black"

[fortran]
symbol = " "
format = '[${symbol}${version}]($style)'
style = "bright-black"

