# Terminal & Ghostty features (truecolor, undercurl, hyperlinks, osc7, progressbar, sync)
set -g default-terminal "tmux-256color"
set -su terminal-features
set -as terminal-features ",*ghostty*:RGB:usstyle:extkeys:hyperlinks:osc7:progressbar:sync:clipboard:ccolour:cstyle:focus:title"

# Forward CSI-u keys (Shift+Enter, Ctrl+Enter from Ghostty) to apps
set -s extended-keys always
set -s extended-keys-format csi-u

# Neovim & Ghostty integration
set -s escape-time 10
set -g focus-events on
set -g allow-passthrough on
set -s set-clipboard on
set -g history-limit 100000
setw -g mode-keys vi

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

unbind C-b
set -g prefix C-s
bind C-s send-prefix

set -g mouse on

# Switch windows
bind -n 'C-,' previous-window
bind -n 'C-.' next-window

# Toggle status bar
bind-key m set-option -g status

# New panes & windows preserve current working directory
bind-key v split-window -v -c "#{pane_current_path}"
bind-key g split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Style Nord
nord0="#2E3440"
nord3="#4C566A"
nord4="#D8DEE9"
nord8="#88C0D0"
nord11="#BF616A"
nord12="#D08770"
nord14="#A3BE8C"

set-option -g status-justify centre

set -g status-left-length 100
set -g status-style "fg=${nord4},bg=default"
set -g status-left "#{?client_prefix,#[fg=${nord0}]#[bg=${nord4} bold]  #S ,#[fg=${nord14}]#[bg=default bold]  #S }"
set -g window-status-current-format "#[fg=${nord8},bold,nounderscore]#I:#[fg=default]#W#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format "#I:#W"
set -g status-right "#{?#{m:*ssh*,#{pane_current_command}},#[fg=${nord11}]#[bg=default bold] 󰢩 SSH ,}#[fg=${nord4}]#[bg=default bold] %a %Y-%m-%d %H:%M"
set -g message-style "fg=${nord4},bg=default"
set -g mode-style "fg=${nord0},bg=${nord8}"
set -g pane-border-style "fg=${nord3}"
set -g pane-active-border-style "fg=${nord4}"
set -g pane-border-lines simple

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
