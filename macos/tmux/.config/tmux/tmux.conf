# Set the default terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:Tc,ghostty:Tc,xterm-256color:Tc"

# Undercurl and colored underlines (spell/ltex diagnostics in nvim)
set -as terminal-features ',xterm-ghostty:RGB:usstyle'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Forward CSI-u keys (Shift+Enter, Ctrl+Enter from Ghostty) to apps
set -s extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys'

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# vim mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
set-option -g focus-events on
set -g mouse on
set -g cursor-style default
set -sg escape-time 0
set -g history-limit 50000

set -g xterm-keys on

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on     # renumber windows when a window is closed
set -g set-titles on           # set terminal title
set -g set-titles-string '#T'  # set terminal title to window name

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

set -g allow-passthrough on

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Switch panes using Alt-hjkl without prefix (left Option in Ghostty)
bind -n 'M-h' select-pane -L
bind -n 'M-j' select-pane -D
bind -n 'M-k' select-pane -U
bind -n 'M-l' select-pane -R

# Switch windows using 1/2 
bind -n 'M-,' previous-window 
bind -n 'M-.' next-window 

# Open new panes/windows
bind-key 'h' split-window -h
bind-key 'v' split-window -v

# Open new panes/windows in current path
bind 'H' split-window -h -c '#{pane_current_path}'
bind 'V' split-window -v -c '#{pane_current_path}'
bind 'C' new-window -c '#{pane_current_path}'

# Toggle status bar
bind -n 'M-m' set-option -g status

# Style
# Nord (https://www.nordtheme.com/docs/colors-and-palettes)
nord0="#2E3440"   # Polar Night: terminal background (Ghostty theme = nord)
nord3="#4C566A"   # Polar Night: borders
nord4="#D8DEE9"   # Snow Storm: text
nord8="#88C0D0"   # Frost: active window, selection
nord11="#BF616A"  # Aurora red
nord12="#D08770"  # Aurora orange
nord14="#A3BE8C"  # Aurora green

set-option -g status-justify centre

set -g status-position bottom
set -g status-left-length 100
set -g status-style "fg=${nord4},bg=default"
set -g status-left "#{?client_prefix,#[fg=${nord0}]#[bg=${nord12} bold]  #S ,#[fg=${nord14}]#[bg=default]  #S }"
set -g window-status-current-format "#[fg=${nord8},bold] #[underscore]#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format " #W"
set -g status-right "#{?#{m:*ssh*,#{pane_current_command}},#[fg=${nord11}]#[bg=default]  SSH ,}#[fg=${nord4}]#[bg=default] %H:%M · %d/%m "
set -g message-style "fg=${nord4},bg=default"
set -g mode-style "fg=${nord0},bg=${nord8}"
set -g pane-border-style "fg=${nord3}"
set -g pane-active-border-style "fg=${nord14}"
