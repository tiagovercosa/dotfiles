"$schema" = 'https://starship.rs/config-schema.json'

palette = "nord"

format = """
${directory}\
${custom.giturl}\
$git_branch\
${custom.git_worktree}\
$git_status\
$line_break\
$character\
"""
right_format = "$c$cpp$python$fortran$lua"

[directory]
disabled = false
style = "bold teal"
format = "[ $path ]($style)"
truncation_symbol = "…/"
truncation_length = 3


[character]
disabled = false
error_symbol = "[✘ ❯](bold fg:red)"
vimcmd_symbol = "[: ❯](bold fg:yellow)"


[custom.giturl]
description = "Display symbol for remote Git server"
command = """
case "$(git ls-remote --get-url 2>/dev/null)" in
    *github*)    echo "  " ;;
    *codeberg*)  echo "  " ;;
    *gitlab*)    echo "  " ;;
    *bitbucket*) echo "  " ;;
    *git*)       echo "  " ;;
esac
"""
shell = ["sh"]
when = true
format = "$output"
require_repo = true
ignore_timeout = true

[git_branch]
symbol = "[](bg1) "
style = "fg:cyan bg:bg1"
format = "  [$symbol$branch]($style)[](bg1)"

[git_status]
format = "[$untracked$staged$modified$renamed$deleted$stashed$conflicted$ahead_behind]($style)"
# options available for format
staged = "[ ${count}+](green)"
modified = "[ ${count}!](yellow)"
renamed = "[ ${count}»](blue)"
deleted = "[ ${count}–](red)"
untracked = "[ ${count}?](red)"
stashed = "[ ${count}≡](cyan)"
conflicted = "[ ${count}✖](red bold)"

ahead = "[ ${count}⇡](teal)"
behind = "[ ${count}⇣](orange)"
diverged = "[ ${ahead_count}⇡ ${behind_count}⇣](purple)"

[custom.git_worktree]
description = "Show indicator when inside a git worktree"
symbol = "⛓"
shell = ["sh"]
when = 'set -- $(git rev-parse --path-format=absolute --git-dir --git-common-dir 2>/dev/null); [ "$1" != "$2" ]'
format = " [$symbol ]($style)"
style = "bold green"
require_repo = true
ignore_timeout = true

[c]
symbol = " "
format = "[ $symbol( $version) ]($style)"

[cpp]
symbol = "󰙲 "
format = "[ $symbol( $version) ]($style)"

[python]
symbol = " "
format = "[ $symbol( $version) ]($style)"

[fortran]
symbol = " "
format = "[ $symbol( $version) ]($style)"

[lua]
symbol = " "
format = "[ $symbol( $version) ]($style)"

[package]
disabled = true


[palettes.nord]
# --- Polar Night ---
bg0 = "#2E3440" # nord0
bg1 = "#3B4252" # nord1
bg2 = "#434C5E" # nord2
bg3 = "#4C566A" # nord3

# --- Snow Storm ---
fg0 = "#D8DEE9" # nord4
fg1 = "#E5E9F0" # nord5
fg2 = "#ECEFF4" # nord6

# --- Frost ---
teal = "#8FBCBB"      # nord7
cyan = "#88C0D0"      # nord8
blue = "#81A1C1"      # nord9
dark_blue = "#5E81AC" # nord10

# --- Aurora ---
red = "#BF616A"    # nord11
orange = "#D08770" # nord12
yellow = "#EBCB8B" # nord13
green = "#A3BE8C"  # nord14
purple = "#B48EAD" # nord15
